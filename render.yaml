# Render Blueprint: one Node web service serving the built client, the content API and Socket.IO.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Render sets PORT automatically.
services:
  - type: web
    name: telesesh-game-demo
    runtime: node
    plan: free
    # NODE_ENV=production makes npm skip devDependencies; the build needs them (tsc, vite, tsx).
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
